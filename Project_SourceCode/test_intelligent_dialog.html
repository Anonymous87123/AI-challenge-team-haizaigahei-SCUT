<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border-left: 4px solid #667eea;
            background: #f8f9ff;
            border-radius: 4px;
        }
        .test-result {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            background: #1a1a2e;
            color: #00ff88;
            padding: 15px;
            border-radius: 4px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
    </style>
</head>

    <div class="max-w-4xl mx-auto">
        <div class="test-container">
            <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
                🧪 智能对话系统测试套件
            </h1>
            
            <div class="text-center mb-6">
                <button id="runTestsBtn" onclick="IntelligentDialogTests.runAllTests()">
                    <i class="fas fa-play"></i> 运行所有测试
                </button>
                <button id="clearBtn" onclick="clearResults()" class="ml-4" style="background: #6c757d;">
                    <i class="fas fa-trash"></i> 清空结果
                </button>
            </div>

            <!-- 总体评分 -->
            <div class="summary-card">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-sm opacity-80">总体评分</div>
                        <div class="score-display" id="overallScore">--%</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm opacity-80">通过率</div>
                        <div class="text-2xl font-bold" id="overallProgress">0/0</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>

            <!-- 测试结果 -->
            <div class="test-section">
                <h3 class="text-xl font-bold mb-4">📋 测试输出</h3>
                <div class="test-result" id="testOutput">
                    <div style="color: #888;">点击"运行所有测试"开始测试...</div>
                </div>
            </div>

            <!-- 详细结果 -->
            <div class="test-section">
                <h3 class="text-xl font-bold mb-4">📊 详细测试结果</h3>
                <div id="detailedResults">
                    <div style="color: #888;">运行测试后显示详细结果...</div>
                </div>
            </div>
        </div>
    </div>

            set: (key, value) => {}
        }
    };
    </script>

    <!-- 加载测试脚本 -->
    <script src="components/dialog_engine/entity_extractor.js"></script>
    <script src="components/dialog_engine/dialog_state_machine.js"></script>
    <script src="components/dialog_engine/response_generator.js"></script>
    <script src="components/dialog_engine/dialog_engine.js"></script>
    <script src="components/dialog_engine/intelligent_dialog_tests.js"></script>

    <script>
        // 修改测试运行器以显示结果
        const originalGenerateTestReport = IntelligentDialogTests.generateTestReport;
        
        IntelligentDialogTests.generateTestReport = function(results) {
            const report = originalGenerateTestReport.call(this, results);
            displayResults(report);
            return report;
        };

        function displayResults(report) {
            // 更新总体评分
            document.getElementById('overallScore').textContent = report.overall.score + '%';
            document.getElementById('overallProgress').textContent = `${report.overall.passed}/${report.overall.total}`;
            document.getElementById('progressBar').style.width = report.overall.score + '%';
            
            // 根据分数设置颜色
            const progressBar = document.getElementById('progressBar');
            if (report.overall.score >= 80) {
                progressBar.style.background = 'linear-gradient(90deg, #10b981 0%, #059669 100%)';
            } else if (report.overall.score >= 60) {
                progressBar.style.background = 'linear-gradient(90deg, #f59e0b 0%, #d97706 100%)';
            } else {
                progressBar.style.background = 'linear-gradient(90deg, #ef4444 0%, #dc2626 100%)';
            }

            // 显示详细结果
            const detailedResults = document.getElementById('detailedResults');
            let html = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg shadow">
                        <h4 class="font-bold mb-2">🏷️ 实体抽取</h4>
                        <div class="text-2xl font-bold ${report.entityExtraction.score >= 80 ? 'text-green-600' : report.entityExtraction.score >= 60 ? 'text-yellow-600' : 'text-red-600'}">
                            ${report.entityExtraction.score}%
                        </div>
                        <div class="text-sm text-gray-600">${report.entityExtraction.passed}/${report.entityExtraction.total} 通过</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow">
                        <h4 class="font-bold mb-2">🎯 意图识别</h4>
                        <div class="text-2xl font-bold ${report.intentRecognition.score >= 80 ? 'text-green-600' : report.intentRecognition.score >= 60 ? 'text-yellow-600' : 'text-red-600'}">
                            ${report.intentRecognition.score}%
                        </div>
                        <div class="text-sm text-gray-600">${report.intentRecognition.passed}/${report.intentRecognition.total} 通过</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow">
                        <h4 class="font-bold mb-2">💬 多轮对话</h4>
                        <div class="text-2xl font-bold ${report.multiTurnDialog.score >= 80 ? 'text-green-600' : report.multiTurnDialog.score >= 60 ? 'text-yellow-600' : 'text-red-600'}">
                            ${report.multiTurnDialog.score}%
                        </div>
                        <div class="text-sm text-gray-600">${report.multiTurnDialog.passed}/${report.multiTurnDialog.total} 通过</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow">
                        <h4 class="font-bold mb-2">⚡ 性能测试</h4>
                        <div class="text-2xl font-bold ${report.performance.score >= 80 ? 'text-green-600' : report.performance.score >= 60 ? 'text-yellow-600' : 'text-red-600'}">
                            ${report.performance.score}%
                        </div>
                        <div class="text-sm text-gray-600">平均 ${report.performance.avgTime}ms</div>
                    </div>
                </div>
            `;
            
            detailedResults.innerHTML = html;
        }

        function clearResults() {
            document.getElementById('testOutput').innerHTML = '<div style="color: #888;">点击"运行所有测试"开始测试...</div>';
            document.getElementById('detailedResults').innerHTML = '<div style="color: #888;">运行测试后显示详细结果...</div>';
            document.getElementById('overallScore').textContent = '--%';
            document.getElementById('overallProgress').textContent = '0/0';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressBar').style.background = 'linear-gradient(90deg, #667eea 0%, #764ba2 100%)';
        }

        // 重定向console.log到页面
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            
            const output = document.getElementById('testOutput');
            const text = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            // 添加颜色
            let coloredText = text;
            if (text.includes('✅')) {
                coloredText = `<span style="color: #00ff88;">${text}</span>`;
            } else if (text.includes('❌')) {
                coloredText = `<span style="color: #ff6b6b;">${text}</span>`;
            } else if (text.includes('⚠️')) {
                coloredText = `<span style="color: #ffd93d;">${text}</span>`;
            } else if (text.includes('📋') || text.includes('🎯') || text.includes('💬') || text.includes('⚠️') || text.includes('⚡')) {
                coloredText = `<span style="color: #667eea; font-weight: bold;">${text}</span>`;
            }
            
            output.innerHTML += coloredText + '\n';
            output.scrollTop = output.scrollHeight;
        };

        const originalConsoleError = console.error;
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            const output = document.getElementById('testOutput');
            const text = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            output.innerHTML += `<span style="color: #ff6b6b;">${text}</span>\n`;
            output.scrollTop = output.scrollHeight;
        };
    </script>
</body>
</html>
